:root{--bg:#F7F1E1;--bg2:#EFE6CE;--card:#FFFDF6;--ink:#0B1B3A;--ink2:#4A5878;--gold:#B8892B;--gold2:#E3B648;--cob:#0047AB;--cob2:#2E6BD6;--good:#1F8A5B;--bad:#C0392B;--line:rgba(11,27,58,.12);--shadow:0 6px 18px rgba(11,27,58,.12);--tab:#0B1B3A;--tabink:#F7F1E1}
html[data-theme=dark]{--bg:#0A1630;--bg2:#0E1D3F;--card:#13244A;--ink:#F5ECD2;--ink2:#A9B6D3;--gold:#E3B648;--gold2:#F2CF7A;--cob:#3D7BEA;--cob2:#6C9BF2;--good:#4ECB92;--bad:#FF7A6B;--line:rgba(245,236,210,.14);--shadow:0 6px 18px rgba(0,0,0,.4);--tab:#071024;--tabink:#F5ECD2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Almarai',system-ui,sans-serif;font-size:17px;line-height:1.55;overscroll-behavior:none}
h1,h2,h3,.ttl{font-family:'El Messiri','Almarai',serif;font-weight:700;margin:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(135deg,#0B1B3A,#12295a);color:#F7F1E1;border-bottom:3px solid var(--gold2)}
header .brand{flex:1;line-height:1.1}
header .brand b{display:block;font-family:'El Messiri';font-size:20px;color:#F2CF7A}
header .brand small{font-size:12px;opacity:.8}
.hbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(242,207,122,.6);background:rgba(255,255,255,.07);color:#F2CF7A;font-size:20px;display:grid;place-items:center;cursor:pointer}
#save-ind{font-size:11px;color:#F2CF7A;opacity:.9;display:flex;align-items:center;gap:4px}
#save-ind i{width:8px;height:8px;border-radius:50%;background:#4ECB92;display:inline-block}
#save-ind.busy i{background:#E3B648;animation:pl .6s infinite alternate}
@keyframes pl{to{opacity:.2}}
#demobar{display:none;background:#B8892B;color:#0B1B3A;padding:6px 14px;font-weight:700;font-size:14px;align-items:center;gap:10px}
#demobar button{margin-right:auto;font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:5px 12px;background:#0B1B3A;color:#F2CF7A}
main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:flex;background:var(--tab);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);border-top:2px solid var(--gold2)}
nav button{flex:1;background:none;border:0;color:var(--tabink);opacity:.62;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;cursor:pointer;position:relative}
nav button svg{width:23px;height:23px}
nav button.on{opacity:1;color:#F2CF7A;background:rgba(242,207,122,.12)}
nav button .dot{position:absolute;top:3px;right:50%;margin-right:-16px;width:9px;height:9px;border-radius:50%;background:#E3524B}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:19px;margin-bottom:8px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.kpi small{color:var(--ink2);font-size:13px;display:block}
.kpi b{font-family:'El Messiri';font-size:22px}
small,.sm{color:var(--ink2);font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.hero{background:linear-gradient(135deg,#0B1B3A,#143074);color:#F7F1E1;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero small{color:rgba(247,241,225,.8)}
.hero .big{font-family:'El Messiri';font-size:34px;color:#F2CF7A;line-height:1.1}
.bar{height:12px;border-radius:8px;background:rgba(128,128,128,.25);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:8px}
.bar.cob>i{background:linear-gradient(90deg,var(--cob),var(--cob2))}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 16px;background:var(--cob);color:#fff;cursor:pointer;min-height:48px}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0B1B3A}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--bad);color:#fff}
.btn.sm2{min-height:38px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.4}
.btn.full{width:100%}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--cob);background:transparent;color:var(--cob);font-size:24px;font-weight:700;cursor:pointer;line-height:1}
html[data-theme=dark] .stepper button{border-color:var(--cob2);color:var(--cob2)}
.stepper output{min-width:64px;text-align:center;font-family:'El Messiri';font-size:21px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:14px;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer}
.chip.on{background:var(--cob);color:#fff;border-color:var(--cob)}
.chip:disabled{opacity:.4}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--bg2);color:var(--ink2)}
.tag.g{background:rgba(31,138,91,.15);color:var(--good)}.tag.r{background:rgba(192,57,43,.15);color:var(--bad)}.tag.y{background:rgba(227,182,72,.25);color:var(--gold)}
.news{padding:10px 0;border-bottom:1px dashed var(--line)}.news:last-child{border:0}
.news b{display:block}
.city{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.city:last-child{border:0}
.city .nm{flex:1}.city .nm b{font-family:'El Messiri';font-size:19px}
.city .nm small{display:block}
.locked{opacity:.55}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg .chip{flex:none;margin:0}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .ic{width:42px;height:42px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:21px;flex:none}
.li .tx{flex:1}.li .tx b{display:block}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,#173a85 0,#0B1B3A 60%,#050c1d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F7F1E1;transition:opacity .6s;text-align:center;padding:20px}
#splash.out{opacity:0;pointer-events:none}
#splash .gl{width:170px;height:170px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splash h1{font-size:34px;color:#F2CF7A;margin-top:18px;line-height:1.25}
#splash p{opacity:.8;margin:6px 0 0}
#splash .by{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);font-size:13px;opacity:.75}
.lockup{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;margin-top:6px;color:var(--ink2);font-size:13px}
.lockup .nm{font-family:'El Messiri';font-size:18px;color:var(--ink)}
.wm{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 70px);font-size:10px;opacity:.35;pointer-events:none;font-family:'El Messiri';color:var(--ink);z-index:5}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,12,29,.65);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:90%;overflow:auto;border-top:3px solid var(--gold2)}
.modal .sheet h3{font-size:22px;margin-bottom:8px}
.choice{display:block;width:100%;text-align:right;font:inherit;background:var(--bg2);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer}
.choice small{display:block}
textarea{width:100%;min-height:100px;font:12px monospace;direction:ltr;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:8px}
.dial{display:block;margin:0 auto;touch-action:none;width:100%;max-width:340px}
.test{font-size:13px;direction:ltr;text-align:left}
.test div{padding:2px 0}
.mini svg{width:100%;height:90px;display:block}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 78px);left:50%;transform:translateX(-50%);background:#0B1B3A;color:#F2CF7A;border:1.5px solid var(--gold2);padding:10px 18px;border-radius:14px;z-index:60;font-size:15px;box-shadow:var(--shadow);max-width:90%;text-align:center}
.chat{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:16px;line-height:1.5}
.bub.me{align-self:flex-start;background:var(--cob);color:#fff;border-bottom-left-radius:4px}
.bub.him{align-self:flex-end;background:var(--bg2);border-bottom-right-radius:4px}
.alert{border-right:5px solid var(--gold2)}
.alert.bad{border-right-color:var(--bad)}
.endhero{text-align:center;padding:24px 10px}
.endhero .big{font-family:'El Messiri';font-size:30px;color:var(--gold)}
.badge{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));font-size:22px}
.badge.off{filter:grayscale(1);opacity:.35}

.ptag{display:inline-block;margin-top:4px;padding:3px 14px;border-radius:12px;background:rgba(242,207,122,.18);color:#F2CF7A;font-size:14px;font-weight:700}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{font:inherit;text-align:right;color:var(--ink);background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pcard.on{border-color:var(--gold2);background:var(--card);box-shadow:0 0 0 3px rgba(227,182,72,.35)}
.pcard .pn{font-weight:700;color:var(--cob)}
.pcard b{font-family:'El Messiri';font-size:28px;line-height:1.1}
.pbar{height:7px;border-radius:5px;background:rgba(128,128,128,.22);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--good);border-radius:5px}
.pbar i.neg{background:var(--bad)}
.pcard .pp{font-size:13px;font-weight:700}
.achg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;opacity:.6}
.ach.on{opacity:1;border-color:var(--gold);background:linear-gradient(160deg,var(--bg2),rgba(227,182,72,.18))}
.ach .ab{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin:0 auto 6px;background:var(--card);border:1.5px solid var(--gold);font-family:'El Messiri',serif;font-weight:700}
.ach b{display:block;font-size:15px}.ach small{display:block;font-size:12px}
textarea{font-size:16px!important}
.chip{min-height:44px;display:inline-flex;align-items:center}
.btn.sm2{min-height:44px}
html{-webkit-text-size-adjust:100%}
button,.chip,.choice,.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#main{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes cardIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(227,182,72,.0)}50%{box-shadow:0 0 0 6px rgba(227,182,72,.28)}}
.modal{animation:fadeIn .2s ease-out}
.modal .sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.toast{animation:toastIn .22s ease-out}
main .card{animation:cardIn .25s ease-out both}
.btn,.chip,.choice{transition:transform .08s ease,filter .15s ease}
.btn:active,.chip:active,.choice:active{transform:scale(.97);filter:brightness(.96)}
.btn.gold:not(:disabled){animation:pulseGold 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ========= Utilities ========= */
const AR='٠١٢٣٤٥٦٧٨٩';
const dg=s=>String(s).replace(/\d/g,d=>AR[d]);
const num=n=>dg(Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'٬')).replace(/-/g,'−');
const money=n=>{const a=Math.abs(n),sg=n<0?'−':'';if(a>=1e6)return sg+dg((Math.round(a/1e4)/100).toString())+' مليون';if(a>=1e3)return sg+dg(Math.round(a/1e3))+' ألف';return sg+dg(Math.round(a))};
const pct=(n,d=1)=>dg(n.toFixed(d))+'٪';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rnd(s){const f=mulberry(s.seed);s.seed=(s.seed+0x9E3779B1)|0;return f()}
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ========= Economics ========= */
const supOf=s=>SUPPLIERS.find(x=>x.id===s.sup);
function costIdx(s){const fx=supOf(s).fx;return .75*s.cum+.25*(1+(s.usd/s.usd0-1)*(.3+.7*fx))}
function unitCost(s,pid){const p=PRODUCTS.find(x=>x.id===pid);return p.cost*costIdx(s)*supOf(s).cost*DIFF[s.diff].cost*(1-.03*s.tech)*(1-.02*skillOf(s,'coo'))*(1-.02*treeN(s,'c'))*(s.focus&&s.focus.k==='cost'?.97:1)}
function refPrice(s,pid){const p=PRODUCTS.find(x=>x.id===pid);return p.cost*p.ref*s.cum*(1+s.brand*.003)}
function priceOptions(s,pid){
 const ref=refPrice(s,pid),p=PRODUCTS.find(x=>x.id===pid),cost=unitCost(s,pid);
 const ideal=cost*p.e/(p.e-1);
 return {comp:ref*.85,market:ref,ideal:ideal,premium:Math.max(ref*1.6,ideal*1.25)};
}
const activeProds=s=>PRODUCTS.filter(p=>!p.ln||(s.lines&&s.lines[p.id]!==undefined));
const lifeAge=(s,p)=>p.ln&&s.lines&&s.lines[p.id]!==undefined?s.month-s.lines[p.id]:0;
function lifeF(s,p){if(!p.ln)return 1;const a=lifeAge(s,p);return a<6?.35+.65*a/6:a<=40?1:Math.max(.3,1-(a-40)*.012)}
function allPrices(s){const o={};activeProds(s).forEach(p=>o[p.id]=priceOf(s,p.id));return o}

function priceOf(s,pid){return s.prices[pid]||Math.round(refPrice(s,pid))}
const macroDemand=s=>clamp(1-(s.rate-15)*.006+s.demandBoost+(s.crisis?s.crisis.dem||0:0),.4,1.4);
const compPressure=s=>compPressure2(s);
function cityEval(s,c,prices,flow){

 const season=1+.05*Math.sin((s.month%12)/12*Math.PI*2);
 const base=d.pop*.55*macroDemand(s)*(1+s.brand/100*.8)*(1+.07*s.tech)*(1+.02*treeN(s,'q'))*(1-compPressure(s))*(1+s.synergy)*season;

 const k=tot>cap?cap/tot:1;
 return {u:[dem[0]*k,dem[1]*k],ul:dem.map(x=>x*k),demand:tot,cap,rent:n*RENT*d.rent*s.cum*szOf(c.id),staff:n*STAFF*s.cum*szOf(c.id)+mgrSal(s,c.id)};
}
function relEff(s,noise){return clamp(supOf(s).rel+.01*skillOf(s,'coo')+s.relBoost+.012*treeN(s,'l')+(s.crisis?s.crisis.rel||0:0)+(noise||0),.3,1)}
/* full month model; r=random source or null for expected value */
function monthly(s,prices,mk,r){
 const AP=activeProds(s);let ul=AP.map(()=>0),rent=0,staff=0;
 s.cities.forEach(c=>{const e=cityEval(s,c,prices);if(e.ul)e.ul.forEach((x,i)=>ul[i]+=x);rent+=e.rent;staff+=e.staff});
 const need=ul.reduce((a,b)=>a+b,0);
 const rel=relEff(s,r?(r()-.5)*.1:0);
 const avail=s.inv+need*rel;
 const sold=Math.min(need,avail);const k=need?sold/need:1;
 const rev=AP.reduce((a,p,i)=>a+ul[i]*k*(prices[p.id]||priceOf(s,p.id)),0);

 const invAfter=s.inv+need*rel-sold;
 const top=Math.max(0,target-invAfter)*rel;
 const bought=need*rel+top;
 const avgc=need?AP.reduce((a,p,i)=>a+ul[i]*unitCost(s,p.id),0)/need:unitCost(s,'eco');
 const cogs=sold*avgc,invCash=(bought-sold)*avgc;
 const invN=Math.max(0,s.inv+bought-sold);
 const hold=invN*avgc*.015;
 const nb=totalBranches(s);const fixed=nb?HQ*s.cum*(1+.12*(nb-1)+.002*nb*nb):0;
 const sal=Object.values(s.execs).reduce((a,e)=>a+e.sal*s.cum,0);
 const fran=franIncome(s);
 const profit=rev-cogs-rent-staff-fixed-mk-s.rd-sal-hold+fran;
 return {fran,rev,units:sold,need,lost:need-sold,invCash,cogs,rent,staff,fixed,mk,rd:s.rd,sal,hold,profit,invN,bought};

const projection=(s,prices,mk)=>monthly(s,prices||allPrices(s),mk===undefined?s.mk:mk,null);
function valuation(s){
 const ttm=s.profits.slice(-12);const avg=ttm.length?ttm.reduce((a,b)=>a+b,0)/ttm.length:0;
 const assets=totalBranches(s)*150000*s.cum+s.inv*UNIT_BASE*100*s.cum;
 const earn=Math.max(0,avg*12)*(1.2+s.brand/50+s.tech*.15)*(1+.01*skillOf(s,'cfo'))*(s.ipo?1.05:1)*(1+.0012*s.esg);

const goalNow=s=>GOALS[s.ch]*(1+(s.cum-1)*.6);
const rankOf=v=>{let r=RANKS[0];for(const x of RANKS)if(v>=x[0])r=x;return r[1]};

/* ========= Month step ========= */
function macroStep(s){
 const k=DIFF[s.diff].news;
 s.infl=clamp(s.infl+(11-s.infl)*.08+(rnd(s)-.5)*.8,3,40);
 s.rate=clamp(s.rate+((s.infl+9)-s.rate)*.08+(rnd(s)-.5)*.3,8,35);
 s.usd=Math.max(30,s.usd*(1+s.infl/1200*.7+(rnd(s)-.5)*.01));
 s.cum*=1+s.infl/1200;
 s.demandBoost*=.85;s.relBoost*=.8;
 if(rnd(s)<.6){let ev=NEWS[Math.floor(rnd(s)*NEWS.length)];for(let k=0;k<4&&s.news.slice(0,3).some(n=>n.t===ev.t);k++)ev=NEWS[Math.floor(rnd(s)*NEWS.length)];
  if(ev.usd)s.usd*=1+ev.usd*k;
  if(ev.infl)s.infl=clamp(s.infl+ev.infl*k,3,40);
  if(ev.rate)s.rate=clamp(s.rate+ev.rate,8,35);
  if(ev.demand)s.demandBoost+=ev.demand*(ev.demand<0?k:1);
  if(ev.rel)s.relBoost+=ev.rel;
  if(ev.comp)s.comps.forEach(c=>{if(!c.acq)c.pw=Math.min(1.5,c.pw+.05)});
  s.news.unshift({m:s.month,t:ev.t,tone:ev.tone});s.news=s.news.slice(0,12);}
}
function stockStep(s){

 s.idx=Math.max(100,s.idx*(1+ret));s.port*=1+ret;
 s.comps.forEach(c=>{if(!c.acq){c.val*=1+.008+(rnd(s)-.5)*.02;c.pw=Math.min(1.5,c.pw+.002)}});
}
function checkTasks(s){
 for(const t of TASKS){if(s.tasks.includes(t.id))continue;let ok=false;try{ok=t.ok(s)}catch(e){}
  if(ok){s.tasks.push(t.id);s.cash+=t.rw;s.notes.push('🎯 دراسة حالة اتحلت: '+t.n+' · مكافأة '+money(t.rw))}}
}
function step(s){
 if(s.over)return s;
 s.month++;
 macroStep(s);stockStep(s);
 const prices=allPrices(s);
 const p=monthly(s,prices,s.mk,()=>rnd(s));
 let cash=s.cash+p.profit-p.invCash;
 cash+=cash>0?Math.min(cash,3e6*s.cum)*s.rate/2/1200:cash*(s.rate+6)/1200;
 let div=0;
 if(s.ipo){if(p.profit>0){div=p.profit*s.payout/100;cash-=div}
  s.trust=clamp(s.trust+(p.profit>0?1.2:-3)+s.payout*.04+s.eth*.01-1.1,0,100);
  s.lowTrust=s.trust<10?s.lowTrust+1:0;}
 s.cash=cash;s.inv=p.invN;
 p4Step(s);
 s.brand=clamp(s.brand+s.mk/8000*(1+.1*skillOf(s,'cmo'))*(1+.06*treeN(s,'m'))*(s.focus&&s.focus.k==='mk'?1.25:1)*(100-s.brand)/100-s.brand*.01,0,100);
 s.rdp+=s.rd*(1+.12*skillOf(s,'cto'))/1000;
 while(s.tech<5&&s.rdp>=rdNeed(s)){s.rdp-=rdNeed(s);s.tech++;s.notes.push('🔬 مستوى التكنولوجيا بقى '+dg(s.tech))}
 s.cities.forEach(c=>{c.ages=c.ages.map(a=>a+1)});
 Object.keys(s.execs).forEach(r=>{const e=s.execs[r];e.left--;if(e.left<=0){delete s.execs[r];s.notes.push('👋 '+e.n+' سابت الشركة لانتهاء العقد')}});
 s.profits.push(p.profit);if(s.profits.length>36)s.profits.shift();
 s.last=Object.assign({div},p);
 if(!s.pending.length)for(const sc of SCENES){if(sc.m<=s.month&&(sc.c||0)<=s.ch&&!s.scenes.includes(sc.id)&&!s.pending.some(x=>x.id===sc.id)){s.pending.push({k:'story',id:sc.id});break}}

/* ========= Actions ========= */
const openCost=(s,id)=>OPEN*cityDef(id).open*s.cum*DIFF[s.diff].cost;
function buyBranches(s,id,n){const c=s.cities.find(x=>x.id===id);let d=0;
 for(let i=0;i<n;i++){if(c.ages.length>=8)break;const cost=openCost(s,id);if(s.cash<cost)break;s.cash-=cost;c.ages.push(0);d++}return d}
function sellBranch(s,id){const c=s.cities.find(x=>x.id===id);if(!c.ages.length||totalBranches(s)<=1)return false;c.ages.pop();s.cash+=openCost(s,id)*.4;return true}
function hireExec(s,role,idx){const c=s.pool[role][idx];if(!c||s.execs[role])return false;const fee=c.sal*2;if(s.cash<fee)return false;
 s.cash-=fee;s.execs[role]={n:c.n,skill:c.skill,sal:c.sal,left:12};s.pool[role]=genPool(s,role);checkTasks(s);return true}
function renewExec(s,role){const e=s.execs[role];if(!e||e.left>3)return false;const fee=e.sal*1.5;if(s.cash<fee)return false;s.cash-=fee;e.sal=Math.round(e.sal*1.1/500)*500;e.left=12;return true}
function fireExec(s,role){if(!s.execs[role])return false;s.cash-=s.execs[role].sal;delete s.execs[role];return true}
function offerAcq(s,i,ratio){

 const price=c.val*ratio;if(s.cash<price)return {ok:false,msg:'الكاش مش كفاية'};
 if(ratio>=c.th){s.cash-=price;c.acq=true;s.synergy+=.04;s.brand=Math.min(100,s.brand+3);
  const t=s.cities.filter(x=>x.ages.length<8).sort((a,b)=>a.ages.length-b.ages.length).slice(0,2);t.forEach(x=>x.ages.push(6));

function stockTrade(s,amt){if(amt>0){amt=Math.min(amt,s.cash);s.cash-=amt;s.port+=amt}else{amt=Math.min(-amt,s.port);s.port-=amt;s.cash+=amt}}
const canIPO=s=>!s.ipo&&valuation(s)>=8e6&&s.brand>=40;
function doIPO(s){if(!canIPO(s))return 0;const raise=valuation(s)*.2*.95;s.cash+=raise;s.ipo=true;s.own=.8;s.trust=60;checkTasks(s);return raise}
function resolveScene(s,id,i){const sc=SCENES.find(x=>x.id===id),c=sc.ch[i];

/* ========= Save code ========= */
const hash=j=>{let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))|0;return (h>>>0).toString(36)};
function encodeSave(s){const j=JSON.stringify(s);return 'BE2:'+hash(j)+':'+btoa(unescape(encodeURIComponent(j)))}
function validState(s){return s&&s.v===2&&Array.isArray(s.cities)&&typeof s.cash==='number'&&s.prices&&s.execs&&Array.isArray(s.comps)}
let DEMO=false,REAL=null;
function decodeSave(code){const m=/^BE2:([0-9a-z]+):([A-Za-z0-9+/=]+)$/.exec((code||'').trim());if(!m)return null;
 try{const j=decodeURIComponent(escape(atob(m[2])));if(hash(j)!==m[1])return null;const s=JSON.parse(j);return validState(s)?fixState(s):null}catch(e){return null}}
/* pick the newest valid save from candidate JSON strings */
function pickSave(list){const c=[];for(const j of list){if(!j)continue;try{const s=JSON.parse(j);if(validState(s))c.push(fixState(s))}catch(e){}}c.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));return c[0]||null}
/* ========= Storage ========= */
const LS='be2_save',IDBN='be2db';let idb=null,NS='';

const idbPut=(k,v)=>new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,NS+k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}});
const idbGet=k=>new Promise(res=>{if(!idb)return res(null);try{const r=idb.transaction('kv').objectStore('kv').get(NS+k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}});
const idbDel=k=>new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').delete(NS+k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}});
const lsSet=(k,v)=>{try{localStorage.setItem(NS+k,v)}catch(e){}};const lsGet=k=>{try{return localStorage.getItem(NS+k)}catch(e){return null}};

async function loadAll(){

 return s;
}

/* async persistence tests (own namespace, never touches the real save) */

 try{
  await idbOpen();
  const a=newState(77);a.cash=123456;step(a);
  for(let i=0;i<7;i++)await persist(a);

  await idbPut('save','{corrupt');lsSet(LS,'{corrupt');

  const b=newState(78);b.cash=999;await persist(b);const s3=await loadAll();R.push(['reopen after new save',!!s3&&s3.cash===999]);

function compass(){
 const e=clamp(G.eth,-100,100),cx=110,cy=100,R=82;
 const P=(a,r)=>[(cx+r*Math.sin(a*Math.PI/180)).toFixed(1),(cy-r*Math.cos(a*Math.PI/180)).toFixed(1)];
 const arc=(e1,e2,col)=>{const a=P(e1*.9,R),b=P(e2*.9,R);return `<path d="M${a[0]} ${a[1]}A${R} ${R} 0 0 1 ${b[0]} ${b[1]}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="butt"/>`};
 const n=P(e*.9,70);
 return `<svg viewBox="0 0 220 125" style="width:100%;max-width:340px;display:block;margin:0 auto" role="img" aria-label="بوصلة الأخلاق"><circle cx="${cx}" cy="${cy}" r="${R-14}" fill="var(--bg2)" stroke="var(--gold)" stroke-width="1.5"/>${arc(-100,-25,'#C0392B')}${arc(-25,25,'#E3B648')}${arc(25,100,'#1F8A5B')}<path d="M${cx} ${cy-34}L${cx+9} ${cy}L${cx} ${cy+10}L${cx-9} ${cy}Z" fill="var(--gold)" opacity=".5"/><line x1="${cx}" y1="${cy}" x2="${n[0]}" y2="${n[1]}" stroke="var(--cob)" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--navy,#0B1B3A)" stroke="var(--gold)" stroke-width="2"/><text x="18" y="118" font-size="10" fill="var(--ink2)" text-anchor="middle">بلا رحمة</text><text x="202" y="118" font-size="10" fill="var(--ink2)" text-anchor="middle">نزيه</text></svg>`}

/* ========= Stage 1b: R&D tree, branch managers, smart competitors ========= */
const TREE_BR={c:{n:'خفض التكلفة',d:'تكلفة الوحدة أقل ٢٪ لكل عقدة'},q:{n:'الجودة والطلب',d:'طلب أعلى ٢٪ لكل عقدة'},l:{n:'اللوجستيات',d:'موثوقية الإمداد أعلى لكل عقدة'},m:{n:'التسويق الذكي',d:'البراند بيكبر أسرع ٦٪ لكل عقدة'},g:{n:'الاستدامة',d:'نقاط ESG وتخفيف الأزمات لكل عقدة'}};
const TREE_N={c:['أتمتة المخازن','عقود جملة','تصنيع مرن','طاقة أرخص','ذكاء التسعير','إنتاج بلا هدر'],q:['اختبار جودة','تصميم أحدث','ضمان ممتد','تجربة عميل','برنامج ولاء','علامة فاخرة'],l:['تتبّع الشحنات','مخزن إقليمي','مورد بديل','شحن مبرد','مركز توزيع','سلسلة إمداد ذكية'],m:['تحليل بيانات','حملات موجهة','شراكات مؤثرين','تطبيق موبايل','رعاية رياضية','حضور عالمي'],g:['إضاءة موفرة','تعبئة معاد تدويرها','طاقة شمسية','نقل أخضر','اقتصاد دائري','حياد كربوني']};
const TREE=[];for(const b in TREE_N)TREE_N[b].forEach((n,i)=>TREE.push({id:b+(i+1),b,i:i+1,n,rp:8*(i+1)*(i+1)+10,cost:60000*(i+1)*(i+1)}));
const treeN=(s,b)=>(s.tree||[]).filter(x=>x[0]===b).length;
const mgrOf=(s,id)=>(s.mgrs||[]).find(m=>m.city===id);
const mgrBonus=(s,id)=>{const m=mgrOf(s,id);return m?.05*m.lvl*(.5+m.mor/200):0};
const mgrSal=(s,id)=>{const m=mgrOf(s,id);return m?m.sal*s.cum:0};
function buyNode(s,id){const n=TREE.find(x=>x.id===id);if(!n||s.tree.includes(id))return {ok:false,msg:'متاح قبل كده'};
 if(n.i>1&&!s.tree.includes(n.b+(n.i-1)))return {ok:false,msg:'لازم العقدة اللي قبلها'};
 if(s.rp<n.rp)return {ok:false,msg:'نقاط البحث مش كفاية'};const cost=n.cost*s.cum;if(s.cash<cost)return {ok:false,msg:'الكاش مش كفاية'};
 s.rp-=n.rp;s.cash-=cost;s.tree.push(id);return {ok:true,msg:'تم فتح: '+n.n}}
function hireMgr(s,city){const c=s.cities.find(x=>x.id===city);if(!c||!c.ages.length||mgrOf(s,city))return {ok:false,msg:'مش متاح'};
 const sal=8000,fee=sal*2*s.cum;if(s.cash<fee)return {ok:false,msg:'الكاش مش كفاية'};
 s.cash-=fee;s.mgrs.push({n:EXNAMES[Math.floor(rnd(s)*EXNAMES.length)]+' '+EXFAM[Math.floor(rnd(s)*EXFAM.length)],city,lvl:1,mor:70,sal,xp:0});return {ok:true,msg:'تم تعيين مدير فرع'}}
function bonusMgr(s,city){const m=mgrOf(s,city);if(!m||s.cash<m.sal*s.cum)return false;s.cash-=m.sal*s.cum;m.mor=Math.min(100,m.mor+18);return true}
function fireMgr(s,city){const i=s.mgrs.findIndex(m=>m.city===city);if(i<0)return false;s.mgrs.splice(i,1);return true}
const RIVALS=[['الشروق جروب',1.2e8],['أفق التجزئة',1.6e8],['نجمة الشرق',2.2e8],['غلوبال مارت',9e8],['يورو ستور',1.1e9],['باسيفيك ريتيل',1.4e9],['ميغا ورلد',7e9],['أطلس كورب',9e9],['هورايزن',1.2e10],['تيتان ريتيل',3e10],['أوميغا غروب',4e10],['كوزموس',5e10]];
function addRivals(s){const k=(s.ch-1)*3;for(let i=0;i<3;i++){const r=RIVALS[k+i];if(!s.comps.some(c=>c.n===r[0]))s.comps.push({n:r[0],val:r[1],pw:.8+i*.1,acq:false,th:1.1+rnd(s)*.2,fails:0,aggr:1+rnd(s)*.6,war:0})}}
const compPressure2=s=>Math.min(.5,s.comps.reduce((a,c)=>a+(c.acq?0:.035*c.pw*(c.war>0?(s.mk>=50000?1.4:1.8):1)),0));
function p5Step(s){
 s.rp+=s.rd*(1+.12*skillOf(s,'cto'))/10000*(s.focus&&s.focus.k==='rd'?1.5:1);
 s.esg=clamp(s.esg+.05*treeN(s,'g'),0,100);
 s.mgrs=s.mgrs.filter(m=>{const c=s.cities.find(x=>x.id===m.city);if(!c||!c.ages.length)return false;
  m.mor=clamp(m.mor-1.2,0,100);if(m.mor>50)m.xp++;if(m.lvl<5&&m.xp>=8*m.lvl){m.xp=0;m.lvl++;m.sal=Math.round(m.sal*1.35/500)*500;s.notes.push(m.n+' اترقى لمستوى '+dg(m.lvl))}

function resolveEvent(s,id,i){const e=EV_LIST[id],ch=e&&e[2][i];if(!ch)return false;const f=ch[2],u=evUnit(s);
 if(f.c&&f.c<0&&s.cash<-f.c*u*.2)return false;
 s.cash+=(f.c||0)*u;s.brand=clamp(s.brand+(f.b||0),0,100);s.eth=clamp(s.eth+(f.e||0),-100,100);s.esg=clamp(s.esg+(f.g||0),0,100);s.trust=clamp(s.trust+(f.t||0),0,100);
 s.demandBoost+=f.d||0;s.relBoost+=f.r||0;s.evSeen=(s.evSeen||[]).concat(id).slice(-20);
 s.pending=s.pending.filter(x=>!(x.k==='event'&&x.id===id));return true}
function annualRow(s){const L=s.profits.slice(-12);return {y:Math.floor(s.month/12),profit:L.reduce((a,b)=>a+b,0),val:valuation(s),cash:s.cash,br:totalBranches(s),fr:franCount(s),debt:debtOf(s)}}

}
